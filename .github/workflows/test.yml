name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ -v --tb=short

  integration-tests:
    runs-on: windows-latest   # Emulator only available on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Cosmos DB Emulator
        run: |
          # Download and install the emulator silently
          $emulatorMsi = "$env:TEMP\cosmosdb-emulator.msi"
          Invoke-WebRequest -Uri "https://aka.ms/cosmosdb-emulator" -OutFile $emulatorMsi
          Start-Process msiexec.exe -ArgumentList "/i", $emulatorMsi, "/quiet", "/norestart" -Wait
        shell: pwsh

      - name: Start Cosmos DB Emulator
        run: |
          # Start emulator in its own window (NOT -NoNewWindow, which kills on step exit)
          $emulatorPath = "C:\Program Files\Azure Cosmos DB Emulator\Microsoft.Azure.Cosmos.Emulator.exe"
          Start-Process -FilePath $emulatorPath -ArgumentList "/NoExplorer", "/NoUI", "/DisableRateLimiting" -WindowStyle Hidden

          # Poll until emulator is ready (up to 90 seconds)
          $maxRetries = 30
          $retryDelay = 3
          $ready = $false
          for ($i = 0; $i -lt $maxRetries; $i++) {
            try {
              # MUST use 127.0.0.1 — localhost resolves to ::1 (IPv6) on Windows
              # but emulator binds IPv4 only
              $response = Invoke-RestMethod -Uri "https://127.0.0.1:8081/_explorer/emulator.pem" -SkipCertificateCheck -TimeoutSec 5
              if ($response) {
                Write-Host "Emulator is ready after $($i * $retryDelay) seconds"
                $ready = $true
                break
              }
            } catch {
              Write-Host "Waiting for emulator... attempt $($i + 1)/$maxRetries"
              Start-Sleep -Seconds $retryDelay
            }
          }
          if (-not $ready) {
            Write-Error "Cosmos DB Emulator failed to start within $($maxRetries * $retryDelay) seconds"
            exit 1
          }
        shell: pwsh

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m integration
        env:
          COSMOS_ENDPOINT: "https://127.0.0.1:8081"
          COSMOS_KEY: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
          PYTHONHTTPSVERIFY: "0"
